name: Semgrep

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Semgrep
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-semgrep
          restore-keys: |
            ${{ runner.os }}-pip-semgrep
      
      - name: Run Semgrep Scan
        run: |
            semgrep scan \
            --pro \
            --config="p/owasp-top-ten" \
            --sarif \
            --output="semgrep-results.sarif" \
            --metrics=off \
            --error
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      # NOVO PASSO: Traduz o level do Semgrep para severidade do GitHub
      - name: Fix SARIF Severity Levels
        if: always()
        run: |
          python3 -c "
          import json
          import os

          with open('semgrep-results.sarif', 'r') as f:
              data = json.load(f)

          for run in data.get('runs', []):
              rules = run.get('tool', {}).get('driver', {}).get('rules', [])
              for rule in rules:
                  # 1. Pegamos o level básico (error, warning, note)
                  level = rule.get('defaultConfiguration', {}).get('level', 'warning').upper()
                  tags = rule.get('properties', {}).get('tags', [])
                  rule_id = rule.get('id', '').lower()

                  # 2. Lógica de Distinção:
                  # Se for 'error' e tiver 'HIGH CONFIDENCE', ou for uma vulnerabilidade 
                  # crítica conhecida (como SQL Injection ou RCE), damos score de CRITICAL.
                  if level == 'ERROR':
                      if 'HIGH CONFIDENCE' in tags or 'injection' in rule_id or 'rce' in rule_id:
                          score = '9.5' # GitHub interpreta como CRITICAL
                      else:
                          score = '8.5' # GitHub interpreta como HIGH
                  elif level == 'WARNING':
                      score = '5.5'     # GitHub interpreta como MEDIUM
                  else:
                      score = '2.5'     # GitHub interpreta como LOW

                  # 3. Injetamos o score que o GitHub Code Scanning usa para as cores
                  if 'properties' not in rule:
                      rule['properties'] = {}
                  rule['properties']['security-severity'] = score

          with open('semgrep-results.sarif', 'w') as f:
              json.dump(data, f, indent=2)
          "

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep-results.sarif

      - name: Save SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-results.sarif


